<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You!</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf7f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
  }
  .checkmark {
    font-size: 3rem;
    color: #2f6f4f;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.3rem;
    color: #1f4d36;
    margin: 0 0 8px;
  }
  p {
    color: #666;
    font-size: 0.95rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="checkmark">&#10003;</div>
    <h1>Thank You!</h1>
    <p>Your tip has been sent directly to the housekeeping team. A small gesture that means a lot &mdash; we hope you enjoy the rest of your stay.</p>
  </div>
</body>
</html>
